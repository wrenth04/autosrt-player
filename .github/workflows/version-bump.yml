name: Version Bump
run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to release (x.y.z)
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: release-version-bump
  cancel-in-progress: false

jobs:
  bump-version:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate requested version
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be in x.y.z format."
            exit 1
          fi

          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "This workflow must run from master."
            exit 1
          fi

          TAG="v$VERSION"

          if git tag -l "$TAG" | grep -qx "$TAG"; then
            echo "Tag $TAG already exists locally."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin."
            exit 1
          fi

      - name: Update version in build.gradle.kts
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("app/build.gradle.kts")
          version = os.environ["VERSION"]
          text = path.read_text()

          version_code_pattern = re.compile(r'(?m)^(\s*versionCode\s*=\s*)(\d+)(\s*)$')
          version_name_pattern = re.compile(r'(?m)^(\s*versionName\s*=\s*")[^"]+(")$')

          code_matches = version_code_pattern.findall(text)
          name_matches = version_name_pattern.findall(text)

          if len(code_matches) != 1 or len(name_matches) != 1:
              raise SystemExit(
                  f"Expected exactly one versionCode and one versionName, found {len(code_matches)} and {len(name_matches)}."
              )

          old_code = int(code_matches[0][1])
          new_code = old_code + 1

          text, code_count = version_code_pattern.subn(
              lambda match: f"{match.group(1)}{new_code}{match.group(3)}",
              text,
              count=1,
          )
          text, name_count = version_name_pattern.subn(
              lambda match: f'{match.group(1)}{version}{match.group(2)}',
              text,
              count=1,
          )

          if code_count != 1 or name_count != 1:
              raise SystemExit("Failed to update version values.")

          path.write_text(text)
          print(f"Updated versionCode {old_code} -> {new_code}")
          print(f"Updated versionName -> {version}")
          PY

      - name: Commit version bump and create tag
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          TAG="v$VERSION"

          git add app/build.gradle.kts
          git commit -m "Update version to $VERSION"
          git tag -a "$TAG" -m "Release $VERSION"
          git push --atomic origin HEAD:master "refs/tags/$TAG"

      - name: Dispatch release workflow
        uses: actions/github-script@v7
        with:
          script: |
            const version = process.env.VERSION;
            const tag = `v${version}`;

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'release.yml',
              ref: tag,
            });
